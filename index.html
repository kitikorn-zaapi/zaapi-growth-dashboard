<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zaapi Dashboard · Overview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<main class="max-w-7xl mx-auto p-4 md:p-6 space-y-4">

  <header class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
    <h1 class="text-xl font-semibold">Overview (Layer 1)</h1>
    <div class="flex items-center gap-2">
      <button onclick="openAISettings()" class="text-xs px-2 py-1.5 bg-slate-900 border border-slate-700 text-slate-300 rounded hover:border-slate-500" title="Set Anthropic API key">⚙ API key</button>
      <nav id="shared-nav" class="flex gap-2 flex-wrap"></nav>
    </div>
  </header>

  <section class="bg-slate-900 border border-slate-800 rounded p-3 flex flex-wrap gap-3 items-end">
    <label class="text-sm">Week
      <select id="week-select" class="ml-2 bg-slate-950 border border-slate-700 rounded p-1"></select>
    </label>
    <label class="text-sm">Currency
      <select id="currency-toggle" class="ml-2 bg-slate-950 border border-slate-700 rounded p-1">
        <option>THB</option><option>USD</option>
      </select>
    </label>
  </section>

  <div id="loading" class="text-sm text-slate-300">Loading data from Google Sheets...</div>

  <section id="content" class="hidden space-y-4">

    <article class="bg-slate-900 border border-slate-800 rounded p-3">
      <div class="flex flex-wrap items-center gap-4">
        <div>
          <div class="text-xs text-slate-500 uppercase tracking-wide">Global health</div>
          <div id="global-health" class="text-lg font-semibold"></div>
        </div>
        <div>
          <div class="text-xs text-slate-500 uppercase tracking-wide">FTI vs target</div>
          <div id="fti-target" class="text-lg font-semibold"></div>
        </div>
        <div class="flex-1">
          <div class="text-xs text-slate-500 uppercase tracking-wide">Summary</div>
          <div id="ai-summary" class="text-sm"></div>
        </div>
      </div>
    </article>

    <div id="market-grid" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>

    <!-- ═══ AI Suggestions Panel — this week + last 2 weeks outcomes ═══ -->
    <div id="ai-suggestions-panel"></div>

    <article class="bg-slate-900 border border-slate-800 rounded p-3">
      <div class="flex items-center justify-between mb-2">
        <h2 class="font-semibold">FTI trend (last 8 weeks + prediction)</h2>
        <div id="trend-label" class="text-xs text-slate-400"></div>
      </div>
      <canvas id="fti-trend" height="80"></canvas>
    </article>

    <article class="bg-slate-900 border border-slate-800 rounded p-3">
      <h2 class="font-semibold mb-2">Look deeper</h2>
      <div id="look-links" class="text-sm"></div>
    </article>
  </section>
</main>

<script src="data-service.js"></script>
<script src="shared-nav.js"></script>
<script src="ai-analyzer.js"></script>
<script src="ai-suggestions-panel.js"></script>
<script src="app.js"></script>
</body>
</html>
