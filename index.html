<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zaapi Dashboard · Overview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-4">
    <header class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
      <h1 class="text-xl font-semibold">Overview (Layer 1)</h1>
      <nav id="shared-nav" class="flex gap-2 flex-wrap"></nav>
    </header>

    <section class="bg-slate-900 border border-slate-800 rounded p-3 grid grid-cols-1 md:grid-cols-4 gap-3 items-center">
      <label class="text-sm">Week
        <select id="week-select" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded p-2"></select>
      </label>
      <label class="text-sm">Spend unit
        <select id="currency-toggle" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded p-2">
          <option value="THB">THB</option>
          <option value="USD">USD</option>
        </select>
      </label>
      <div class="text-sm"><div class="text-slate-400">FTI actual vs target</div><div id="fti-target" class="font-semibold">—</div></div>
      <div class="text-sm"><div class="text-slate-400">Health signal</div><div id="global-health" class="font-semibold">—</div></div>
    </section>

    <div id="loading" class="text-sm text-slate-300">Loading data from Google Sheets...</div>

    <section id="content" class="hidden space-y-4">
      <article class="bg-indigo-950/60 border border-indigo-700 rounded p-4">
        <h2 class="text-xs uppercase text-indigo-300 tracking-wide mb-1">AI Summary</h2>
        <p id="ai-summary" class="text-base leading-relaxed"></p>
      </article>

      <article class="bg-slate-900 border border-slate-800 rounded p-4">
        <h2 class="text-sm font-semibold mb-2">AI Forecast</h2>
        <canvas id="fti-trend" height="70"></canvas>
        <p id="trend-label" class="text-sm mt-2 text-slate-300"></p>
      </article>

      <section class="grid grid-cols-1 lg:grid-cols-3 gap-3" id="market-grid"></section>

      <section class="bg-slate-900 border border-slate-800 rounded p-4">
        <h2 class="text-sm font-semibold mb-1">Budget reallocation panel</h2>
        <p id="reallocation" class="text-sm text-slate-300"></p>
      </section>

      <section class="bg-slate-900 border border-slate-800 rounded p-4">
        <h2 class="text-sm font-semibold mb-2">Where to look</h2>
        <div id="look-links" class="text-sm flex flex-wrap gap-2"></div>
      </section>
    </section>
  </main>
  <script src="data-service.js"></script>
  <script src="shared-nav.js"></script>
  <script src="app.js"></script>
</body>
</html>
