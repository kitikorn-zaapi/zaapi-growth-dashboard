<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zaapi Dashboard · Search</title><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<main class="max-w-7xl mx-auto p-4 md:p-6 space-y-4">
  <header class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between"><h1 class="text-xl font-semibold">Campaign Layer (Layer 2)</h1><nav id="shared-nav" class="flex gap-2 flex-wrap"></nav></header>
  <div id="loading" class="text-sm text-slate-300">Loading data from Google Sheets...</div>
  <section id="content" class="hidden space-y-4">
    <article class="bg-slate-900 border border-slate-800 rounded p-3 overflow-auto"><h2 class="font-semibold mb-2">Google Search</h2><table class="w-full text-sm" id="google-table"></table></article>
    <article class="bg-slate-900 border border-slate-800 rounded p-3 overflow-auto"><h2 class="font-semibold mb-2">Meta Campaign</h2><table class="w-full text-sm" id="meta-table"></table></article>
    <article class="bg-slate-900 border border-slate-800 rounded p-3"><h2 class="font-semibold mb-2">Suggestion strip</h2><div id="suggestions" class="text-sm text-slate-300"></div></article>
  </section>
</main>
<script src="data-service.js"></script><script src="shared-nav.js"></script><script src="search.js"></script>
</body></html>
