<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zaapi Dashboard · Asset</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<main class="max-w-7xl mx-auto p-4 md:p-6 space-y-4">

  <header class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
    <h1 class="text-xl font-semibold">Asset Layer (Layer 3)</h1>
    <nav id="shared-nav" class="flex gap-2 flex-wrap"></nav>
  </header>

  <!-- Filter bar -->
  <section class="bg-slate-900 border border-slate-800 rounded p-3 flex flex-wrap gap-3 items-end">
    <label class="text-sm">Currency
      <select id="currency" class="ml-2 bg-slate-950 border border-slate-700 rounded p-1">
        <option>USD</option>
        <option>THB</option>
      </select>
    </label>
    <label class="text-sm">usd_thb_rate
      <input id="usd-rate" class="ml-2 w-24 bg-slate-950 border border-slate-700 rounded p-1" />
    </label>
    <label class="text-sm">Funnel
      <select id="funnel" class="ml-2 bg-slate-950 border border-slate-700 rounded p-1">
        <option value="All">All</option>
        <option value="TOF">TOF</option>
        <option value="BOF">BOF</option>
      </select>
    </label>
    <label class="text-sm">Region
      <select id="region" class="ml-2 bg-slate-950 border border-slate-700 rounded p-1">
        <option value="All">All</option>
        <option value="TH">TH</option>
        <option value="SEA">SEA</option>
        <option value="ROW">ROW</option>
      </select>
    </label>
  </section>

  <div id="loading" class="text-sm text-slate-300">Loading data from Google Sheets...</div>

  <section id="content" class="hidden space-y-4">

    <!-- Segment Analysis: which Angle / Production / Region is working? -->
    <article class="bg-slate-900 border border-slate-800 rounded p-3">
      <div class="flex items-center justify-between mb-2">
        <h2 class="font-semibold">Segment Analysis · what's working</h2>
        <label class="text-xs text-slate-400">Group by
          <select id="segment-dim" class="ml-2 bg-slate-950 border border-slate-700 rounded p-1 text-xs">
            <option value="angle">Angle</option>
            <option value="prod">Production</option>
            <option value="region">Region</option>
            <option value="feature1">Feature</option>
          </select>
        </label>
      </div>
      <div class="overflow-auto">
        <table class="w-full text-sm" id="segment-table"></table>
      </div>
    </article>

    <!-- Ad cards -->
    <div id="cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>

    <!-- Summary table -->
    <article class="bg-slate-900 border border-slate-800 rounded p-3 overflow-auto">
      <h2 class="font-semibold mb-2">Sortable summary table</h2>
      <table class="w-full text-sm" id="summary"></table>
    </article>
  </section>
</main>

<script src="data-service.js"></script>
<script src="shared-nav.js"></script>
<script src="meta-asset.js"></script>
</body>
</html>
